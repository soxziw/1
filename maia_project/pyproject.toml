[project]
name = "maia"
version = "0.1.0"
description = "MAIA: Multi-Agent Itinerary Assistant using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.102.0,<1.0.0",
    "google-search-results>=2.4.2",
    "pydantic>=2.0.0",
    "python-dotenv",
]

[project.scripts]
maia = "maia.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
